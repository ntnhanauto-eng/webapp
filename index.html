<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tin tức tổng hợp</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
    .news-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
    .news-item h3 { margin: 0 0 5px; font-size: 18px; }
    .news-item p { margin: 0; font-size: 14px; color: #555; }
    .time { font-size: 12px; color: #999; }
    .loading { color: #666; }
  </style>
</head>
<body>

<h1>Tin tức mới nhất</h1>
<div id="news-container" class="loading">Đang tải tin...</div>

<script>
  // CORS proxy miễn phí + RSS của VnExpress
  const RSS_URLS = [
    'https://vnexpress.net/rss/tin-moi-nhat.rss',
    'https://dantri.com.vn/rss/tinmoi.rss',
    'https://tuoitre.vn/rss/tin-moi-nhat.rss'
  ];

  async function fetchRSS(rssUrl) {
    try {
      // Dùng CORS proxy miễn phí allorigins.win
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
      const response = await fetch(proxyUrl);
      const text = await response.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(text, 'text/xml');
      
      return Array.from(xmlDoc.querySelectorAll('item')).slice(0, 5).map(item => ({
        title: item.querySelector('title').textContent,
        link: item.querySelector('link').textContent,
        description: item.querySelector('description').textContent,
        pubDate: item.querySelector('pubDate').textContent
      }));
    } catch (e) {
      console.error(`Lỗi RSS ${rssUrl}:`, e);
      return [];
    }
  }

  async function loadNews() {
    const container = document.getElementById('news-container');
    container.innerHTML = '<div class="loading">Đang tải tin...</div>';
    
    try {
      // Lấy tin từ 3 nguồn song song
      const newsPromises = RSS_URLS.map(fetchRSS);
      const allNews = await Promise.all(newsPromises);
      const newsList = allNews.flat().slice(0, 20); // Top 20 tin
      
      container.innerHTML = '';
      newsList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'news-item';
        div.innerHTML = `
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <p>${item.description.substring(0, 150)}...</p>
          <div class="time">${new Date(item.pubDate).toLocaleString('vi-VN')}</div>
        `;
        container.appendChild(div);
      });
    } catch (e) {
      container.innerHTML = 'Lỗi tải tin. Thử lại sau.';
      console.error(e);
    }
  }

  // Tải ngay khi mở trang
  loadNews();
  // Cập nhật mỗi 5 phút
  setInterval(loadNews, 5 * 60 * 1000);
</script>

</body>
</html>
