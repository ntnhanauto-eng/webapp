<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tin tức Khánh Hòa</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

#news{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:15px;
padding:20px;
max-width:1200px;
margin:auto;
}

.article{
background:#1e293b;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.2s;
}

.article:hover{
transform:scale(1.03);
background:#334155;
}

.article img{
width:100%;
height:160px;
object-fit:cover;
}

.content{
padding:10px;
}

.title{
font-size:15px;
font-weight:bold;
}

.source{
font-size:12px;
color:#94a3b8;
margin-top:6px;
}

.priority{
border:2px solid #22c55e;
}

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
z-index:999;
}

#viewer iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:10px;
right:10px;
background:red;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
z-index:1000;
}

</style>

</head>

<body>

<header>
TIN TỨC KHÁNH HÒA & VIỆT NAM
</header>

<div id="news"></div>

<div id="viewer">

<div id="close">Đóng</div>

<iframe id="frame"></iframe>

</div>

<script>

const feeds=[

/* Ưu tiên báo Khánh Hòa */
{url:"https://baokhanhhoa.vn/rss/tin-moi-nhat.rss",name:"BaoKhanhHoa",priority:true},

/* báo khác */
{url:"https://baokhanhhoa.vn/rss/tin-moi-nhat.rss",name:"Báo Khánh Hoà"},
{url:"https://dantri.com.vn/trangchu.rss",name:"DanTri"},
{url:"https://vtc.vn/rss/feed.rss",name:"VTC"},
{url:"https://baomoi.com/tag/rss.epi",name:"Baomoi"}

];

let news=[];

async function loadNews(){

news=[];

for(const feed of feeds){

const api="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed.url);

try{

const res=await fetch(api);
const data=await res.json();

data.items.forEach(item=>{

news.push({

title:item.title,
link:item.link,
image:item.thumbnail || "",
source:feed.name,
priority:feed.priority || false,
date:new Date(item.pubDate)

});

});

}catch(e){
console.log("RSS lỗi:",feed.name);
}

}

renderNews();

}

function renderNews(){

/* Ưu tiên báo Khánh Hòa trước */
news.sort((a,b)=>{

if(a.priority && !b.priority) return -1;
if(!a.priority && b.priority) return 1;

return b.date-a.date;

});

const container=document.getElementById("news");

container.innerHTML="";

news.slice(0,40).forEach(n=>{

const div=document.createElement("div");

div.className="article";

if(n.priority) div.classList.add("priority");

div.innerHTML=`

<img src="${n.image || 'https://via.placeholder.com/400x200'}">

<div class="content">

<div class="title">${n.title}</div>

<div class="source">${n.source}</div>

</div>

`;

div.onclick=()=>openNews(n.link);

container.appendChild(div);

});

}

function openNews(url){

document.getElementById("viewer").style.display="block";

document.getElementById("frame").src=url;

}

document.getElementById("close").onclick=function(){

document.getElementById("viewer").style.display="none";

document.getElementById("frame").src="";

}

loadNews();

/* cập nhật mỗi 5 phút */
setInterval(loadNews,300000);

</script>

</body>
</html>
