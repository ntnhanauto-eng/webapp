<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar mưa + dự báo</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1e2d;
color:white;
text-align:center;
}

header{
background:#082033;
padding:10px;
font-size:20px;
}

#map{
width:100%;
height:60vh;
}

#forecast{
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

</style>

</head>

<body>

<header>🌧 Radar mưa + dự báo ~2h</header>

<div id="map"></div>

<div id="forecast">

<h3>⏱ Dự báo radar</h3>

<table>

<thead>
<tr>
<th>Thời gian</th>
<th>Trạng thái radar</th>
</tr>
</thead>

<tbody id="radarTable"></tbody>

</table>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const lat = 12.55
const lon = 109.2
const zoom = 7

const map = L.map('map',{
minZoom:3,
maxZoom:10
}).setView([lat,lon],zoom)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:10
}).addTo(map)

let radarLayers=[]
let framePosition=0

fetch("https://api.rainviewer.com/public/weather-maps.json")

.then(res=>res.json())

.then(data=>{

const host=data.host

let frames = []

if(data.radar.nowcast && data.radar.nowcast.length>0){
frames = data.radar.nowcast
}else{
frames = data.radar.past.slice(-6)
}

let html=""

frames.forEach(frame=>{

const tileLayer=L.tileLayer(
`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`,
{
tileSize:256,
opacity:0,
maxZoom:10
})

radarLayers.push({
layer:tileLayer,
time:frame.time
})

tileLayer.addTo(map)

let date=new Date(frame.time*1000)

html+=`
<tr>
<td>${date.toLocaleTimeString()}</td>
<td>Khả năng mưa</td>
</tr>
`

})

document.getElementById("radarTable").innerHTML=html

animate()

})

function animate(){

setInterval(()=>{

radarLayers.forEach(f=>f.layer.setOpacity(0))

let frame=radarLayers[framePosition]

frame.layer.setOpacity(0.8)

framePosition++

if(framePosition>=radarLayers.length){
framePosition=0
}

},800)

}

</script>

</body>

</html>
