<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tin từ Báo Mới</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

#news{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:15px;
padding:20px;
max-width:1200px;
margin:auto;
}

.article{
background:#1e293b;
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.article img{
width:100%;
height:160px;
object-fit:cover;
}

.content{
padding:10px;
}

.title{
font-size:15px;
font-weight:bold;
}

.date{
font-size:12px;
color:#94a3b8;
margin-top:5px;
}

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
}

#viewer iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:10px;
right:10px;
background:red;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<header>
TIN TỔNG HỢP BÁO MỚI
</header>

<div id="news"></div>

<div id="viewer">
<div id="close">Đóng</div>
<iframe id="frame"></iframe>
</div>

<script>

async function loadNews(){

const url="https://api.rss2json.com/v1/api.json?rss_url=https://baomoi-com.webnode.vn/rss/all.xml";

const res=await fetch(url);

const data=await res.json();

const container=document.getElementById("news");

container.innerHTML="";

data.items.slice(0,40).forEach(item=>{

const div=document.createElement("div");

div.className="article";

div.innerHTML=`

<img src="${item.thumbnail || 'https://via.placeholder.com/400x200'}">

<div class="content">

<div class="title">${item.title}</div>

<div class="date">${item.pubDate}</div>

</div>

`;

div.onclick=()=>openNews(item.link);

container.appendChild(div);

});

}

function openNews(url){

document.getElementById("viewer").style.display="block";

document.getElementById("frame").src=url;

}

document.getElementById("close").onclick=function(){

document.getElementById("viewer").style.display="none";

document.getElementById("frame").src="";

}

loadNews();

/* cập nhật mỗi 5 phút */

setInterval(loadNews,300000);

</script>

</body>
</html>
