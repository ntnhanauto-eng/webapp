<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mực nước hồ</title>

<style>
body {
  background: #2c3e50;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

/* Box */
.box {
  width: 160px;
  background: #ecf0f1;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Title */
.title {
  color: #3498db;
  font-size: 16px;
  margin-bottom: 5px;
}

/* Value */
.value {
  font-size: 48px;
  color: red;
  font-weight: bold;
}

/* Unit */
.unit {
  font-size: 14px;
  color: #555;
}

/* trạng thái */
.status {
  margin-top: 8px;
  font-size: 13px;
  font-weight: bold;
}
</style>

</head>
<body>

<div class="box">
  <div class="title">Mực nước</div>
  <div class="value" id="water">--</div>
  <div class="unit">h</div>
  <div class="status" id="status">Đang tải...</div>
</div>

<script>

// 👉 THAY URL NÀY bằng API thật bạn copy từ DevTools
const API_URL = "http://e15.thuyloivietnam.vn/AnToan/ATView";

function loadData() {
  fetch(API_URL, {
    credentials: "include" // cần nếu API dùng cookie
  })
  .then(res => res.json())
  .then(data => {

    // 🔥 Lấy mực nước
    const item = data.find(i => i.name === "ATCBMNHo");

    if (!item) {
      document.getElementById("status").innerText = "Không có dữ liệu";
      return;
    }

    const value = item.count;

    // hiển thị
    document.getElementById("water").innerText = value;

    // 👉 đổi màu cảnh báo
    let statusText = "Bình thường";
    let color = "green";

    if (value > 80) {
      statusText = "Nguy hiểm";
      color = "red";
    } else if (value > 60) {
      statusText = "Cảnh báo";
      color = "orange";
    }

    document.getElementById("status").innerText = statusText;
    document.getElementById("status").style.color = color;

  })
  .catch(err => {
    console.error(err);
    document.getElementById("status").innerText = "Lỗi tải dữ liệu";
  });
}

// load lần đầu
loadData();

// 🔄 auto refresh mỗi 10 giây
setInterval(loadData, 10000);

</script>

</body>
</html>
