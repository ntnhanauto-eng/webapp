<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin tức nhanh</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      max-width: 800px; margin: 20px auto; line-height: 1.5;
    }
    .news-item { 
      margin-bottom: 12px; padding: 12px; border: 1px solid #e5e5e5; 
      border-radius: 8px; background: #fafafa;
    }
    .news-item h3 { 
      margin: 0 0 8px 0; font-size: 16px; font-weight: 600;
    }
    .news-item h3 a { color: #1a73e8; text-decoration: none; }
    .news-item h3 a:hover { text-decoration: underline; }
    .news-item p { 
      margin: 0 0 8px 0; font-size: 14px; color: #555; 
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
      overflow: hidden;
    }
    .time { font-size: 12px; color: #888; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .status { position: fixed; top: 10px; right: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>📰 Tin mới nhất</h1>
  <div id="news-container" class="loading">⏳ Đang tải...</div>
  <div id="status" class="status"></div>

  <script>
    // CHỈ 1 nguồn nhanh nhất: VnExpress
    const RSS_URL = 'https://vnexpress.net/rss/tin-moi-nhat.rss';
    let cache = { data: [], timestamp: 0 };
    const CACHE_TIME = 5 * 60 * 1000; // 5 phút

    async function fetchRSS() {
      // Cache hit: dùng ngay
      if (Date.now() - cache.timestamp < CACHE_TIME && cache.data.length) {
        renderNews(cache.data);
        return;
      }

      try {
        document.getElementById('news-container').innerHTML = '⏳ Đang tải...';
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(RSS_URL)}`;
        const response = await fetch(proxyUrl, { cache: 'no-cache' });
        const text = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, 'text/xml');
        
        const news = Array.from(xmlDoc.querySelectorAll('item')).slice(0, 15).map(item => ({
          title: item.querySelector('title')?.textContent || '',
          link: item.querySelector('link')?.textContent || '#',
          description: item.querySelector('description')?.textContent || '',
          pubDate: item.querySelector('pubDate')?.textContent || ''
        })).filter(item => item.title);

        cache = { data: news, timestamp: Date.now() };
        renderNews(news);
        updateStatus('✅ Cập nhật mới');
      } catch (e) {
        renderNews(cache.data || []);
        updateStatus('⚠️ Dùng cache cũ');
        console.error('Lỗi:', e);
      }
    }

    function renderNews(news) {
      const container = document.getElementById('news-container');
      if (!news.length) {
        container.innerHTML = '<div style="text-align:center;color:#999">Không có tin mới</div>';
        return;
      }

      container.innerHTML = news.map(item => `
        <div class="news-item">
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <p>${item.description.replace(/<[^>]*>/g, '').substring(0, 120)}...</p>
          <div class="time">${new Date(item.pubDate).toLocaleString('vi-VN', {timeZone: 'Asia/Ho_Chi_Minh'})}</div>
        </div>
      `).join('');
    }

    function updateStatus(text) {
      document.getElementById('status').textContent = `${text} | ${new Date().toLocaleTimeString('vi-VN')}`;
    }

    // Tải NGAY + cache 5 phút
    fetchRSS();
    setInterval(fetchRSS, CACHE_TIME);
  </script>
</body>
</html>
