<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar mưa + dự báo 2h</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#062338;
color:white;
}

header{
background:#062338;
text-align:center;
padding:12px;
font-size:20px;
font-weight:bold;
}

#map{
height:420px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
text-align:center;
}

.section{
padding:10px;
}

</style>

</head>

<body>

<header>
🌧 Radar mưa + dự báo 2h
</header>

<div id="map"></div>

<div class="section">

<h3>⏱ Dự báo radar</h3>

<table>

<tr>
<th>Thời gian</th>
<th>Trạng thái radar</th>
</tr>

<tbody id="forecast"></tbody>

</table>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const lat = 12.55
const lon = 109.2
const zoom = 7

const map = L.map("map").setView([lat,lon],zoom)

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:18
}).addTo(map)

let radarLayer=null

fetch("https://api.rainviewer.com/public/weather-maps.json")

.then(res=>res.json())

.then(data=>{

const host=data.host

const past=data.radar.past
const nowcast=data.radar.nowcast

let frames=[...past.slice(-6),...nowcast]

let lastFrame=frames[frames.length-1]

let path=host+lastFrame.path+"/256/{z}/{x}/{y}/2/1_1.png"

radarLayer=L.tileLayer(path,{
opacity:0.7
})

radarLayer.addTo(map)

createTable(frames)

})

function createTable(frames){

let table=document.getElementById("forecast")

frames.forEach(frame=>{

let time=new Date(frame.time*1000)

let status="Không mưa"

if(frame.path.includes("radar")){
status="Có khả năng mưa"
}

let row=`
<tr>
<td>${time.toLocaleTimeString()}</td>
<td>${status}</td>
</tr>
`

table.innerHTML+=row

})

}

</script>

</body>
</html>
