<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tin từ Báo Mới</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
margin:0;
}

header{
background:#000;
padding:15px;
text-align:center;
font-size:22px;
}

#news{
padding:20px;
}

.article{
background:#1f1f1f;
padding:12px;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
}

.article:hover{
background:#333;
}

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
}

#viewer iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:10px;
right:10px;
background:red;
padding:6px 10px;
cursor:pointer;
}

</style>

</head>

<body>

<header>
TIN MỚI TỪ BAOMOI
</header>

<div id="news"></div>

<div id="viewer">
<div id="close">Đóng</div>
<iframe id="frame"></iframe>
</div>

<script>

async function loadNews(){

const url="https://api.rss2json.com/v1/api.json?rss_url=https://baomoi-com.webnode.vn/rss/all.xml";

const res=await fetch(url);

const data=await res.json();

const container=document.getElementById("news");

data.items.slice(0,20).forEach(item=>{

const div=document.createElement("div");

div.className="article";

div.innerHTML=item.title;

div.onclick=()=>openNews(item.link);

container.appendChild(div);

});

}

function openNews(url){

document.getElementById("viewer").style.display="block";

document.getElementById("frame").src=url;

}

document.getElementById("close").onclick=function(){

document.getElementById("viewer").style.display="none";

document.getElementById("frame").src="";

}

loadNews();

</script>

</body>
</html>
