<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tin Nhanh 24h</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #334155;
}

#news{
padding:15px;
}

.article{
padding:12px;
margin-bottom:10px;
background:#1e293b;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.article:hover{
background:#334155;
}

.title{
font-size:16px;
font-weight:bold;
}

.source{
font-size:12px;
color:#94a3b8;
margin-top:5px;
}

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
z-index:999;
}

#viewer iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:10px;
right:15px;
font-size:20px;
background:red;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<header>
TIN TỨC MỚI NHẤT
</header>

<div id="news"></div>

<div id="viewer">
<div id="close">Đóng</div>
<iframe id="frame"></iframe>
</div>

<script>

const feeds = [

{
url:"https://vnexpress.net/rss/tin-moi-nhat.rss",
name:"VnExpress"
},

{
url:"https://tuoitre.vn/rss/tin-moi-nhat.rss",
name:"Tuổi Trẻ"
},

{
url:"https://thanhnien.vn/rss/home.rss",
name:"Thanh Niên"
}

];

async function loadNews(){

const container = document.getElementById("news");

for(const feed of feeds){

const url = "https://api.rss2json.com/v1/api.json?rss_url="+feed.url;

const res = await fetch(url);
const data = await res.json();

data.items.slice(0,5).forEach(item=>{

const div = document.createElement("div");
div.className="article";

div.innerHTML=
`
<div class="title">${item.title}</div>
<div class="source">${feed.name}</div>
`;

div.onclick=()=>openNews(item.link);

container.appendChild(div);

});

}

}

function openNews(url){

document.getElementById("viewer").style.display="block";
document.getElementById("frame").src=url;

}

document.getElementById("close").onclick=function(){

document.getElementById("viewer").style.display="none";
document.getElementById("frame").src="";

}

loadNews();

</script>

</body>
</html>
