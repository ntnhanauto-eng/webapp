<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar mưa Ninh Hòa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#051f2f;
color:white;
}

header{
text-align:center;
padding:12px;
font-size:20px;
font-weight:bold;
}

#map{
height:420px;
}

.controls{
text-align:center;
padding:10px;
}

button{
padding:6px 14px;
font-size:16px;
margin:5px;
}

#timeline{
width:90%;
}

#timeLabel{
margin-top:5px;
font-size:14px;
}

.alert{
text-align:center;
padding:8px;
color:#ffcc00;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
text-align:center;
}

</style>

</head>

<body>

<header>
🌧 Radar mưa Ninh Hòa
</header>

<div id="map"></div>

<div class="controls">

<button onclick="play()">▶ Play</button>
<button onclick="pause()">⏸ Pause</button>

<br><br>

<input type="range" id="timeline" min="0" max="10" value="0">

<div id="timeLabel"></div>

</div>

<div class="alert" id="rainAlert"></div>

<h3 style="text-align:center">⏱ Dự báo radar</h3>

<table>

<tr>
<th>Thời gian</th>
<th>Trạng thái</th>
</tr>

<tbody id="forecast"></tbody>

</table>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const lat=12.55
const lon=109.2
const zoom=7

const map=L.map("map").setView([lat,lon],zoom)

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map)

L.marker([lat,lon]).addTo(map).bindPopup("Ninh Hòa")

let radarLayers=[]
let frames=[]
let frameIndex=0
let animation=null

fetch("https://api.rainviewer.com/public/weather-maps.json")

.then(res=>res.json())

.then(data=>{

const host=data.host

const past=data.radar.past
const nowcast=data.radar.nowcast

frames=[...past.slice(-6),...nowcast]

document.getElementById("timeline").max=frames.length-1

frames.forEach(frame=>{

let layer=L.tileLayer(
host+frame.path+"/256/{z}/{x}/{y}/2/1_1.png",
{opacity:0.6}
)

radarLayers.push(layer)

})

radarLayers[0].addTo(map)

updateTime(0)

createTable(frames)

checkRain(frames)

})

function showFrame(i){

radarLayers.forEach(l=>map.removeLayer(l))

radarLayers[i].addTo(map)

updateTime(i)

document.getElementById("timeline").value=i

}

document.getElementById("timeline").addEventListener("input",function(){

frameIndex=this.value
showFrame(frameIndex)

})

function updateTime(i){

let t=new Date(frames[i].time*1000)

document.getElementById("timeLabel").innerText="Thời gian: "+t.toLocaleTimeString()

}

function play(){

if(animation)return

animation=setInterval(()=>{

frameIndex++

if(frameIndex>=radarLayers.length){
frameIndex=0
}

showFrame(frameIndex)

},700)

}

function pause(){

clearInterval(animation)
animation=null

}

function createTable(frames){

let table=document.getElementById("forecast")

frames.forEach(frame=>{

let time=new Date(frame.time*1000)

let status="Không mưa"

if(frame.path.includes("radar")){
status="Có khả năng mưa"
}

let row=`
<tr>
<td>${time.toLocaleTimeString()}</td>
<td>${status}</td>
</tr>
`

table.innerHTML+=row

})

}

function checkRain(frames){

let alert=document.getElementById("rainAlert")

if(frames.length>6){
alert.innerText="⚠ Radar cho thấy có khả năng mưa trong ~2 giờ tới"
}else{
alert.innerText=""
}

}

</script>

</body>
</html>
