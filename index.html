<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar + Dự báo 3h</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0b2233;
color:white;
}

header{
text-align:center;
padding:10px;
font-size:20px;
font-weight:bold;
}

#map{
height:420px;
}

#info{
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
text-align:center;
}

</style>

</head>

<body>

<header>
🌧 Radar + Dự báo 3 giờ
</header>

<div id="map"></div>

<div id="info">

<h3>📍 Thông tin thời tiết 3 giờ tới</h3>

<table>

<tr>
<th>Thời gian</th>
<th>Nhiệt độ</th>
<th>Mưa</th>
<th>Gió</th>
<th>Trạng thái</th>
</tr>

<tbody id="weatherTable"></tbody>

</table>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// tạo map

const map=L.map("map").setView([12.55,109.2],7)

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map)

let radarLayer

// load radar

fetch("https://api.rainviewer.com/public/weather-maps.json")

.then(r=>r.json())

.then(data=>{

const host=data.host

const frame=data.radar.past.slice(-1)[0]

radarLayer=L.tileLayer(
host+frame.path+"/256/{z}/{x}/{y}/2/1_1.png",
{opacity:0.6}
)

radarLayer.addTo(map)

})

// click map lấy vị trí

map.on("click",function(e){

const lat=e.latlng.lat
const lon=e.latlng.lng

loadWeather(lat,lon)

})

// lấy dự báo

function loadWeather(lat,lon){

fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode,windspeed_10m&forecast_days=1`
)

.then(r=>r.json())

.then(data=>{

let table=document.getElementById("weatherTable")

table.innerHTML=""

let hours=data.hourly.time

for(let i=0;i<3;i++){

let time=new Date(hours[i])

let temp=data.hourly.temperature_2m[i]

let rain=data.hourly.precipitation[i]

let wind=data.hourly.windspeed_10m[i]

let status="Nắng"

if(rain>0){
status="Mưa"
}

let row=`
<tr>
<td>${time.toLocaleTimeString()}</td>
<td>${temp}°C</td>
<td>${rain} mm</td>
<td>${wind} km/h</td>
<td>${status}</td>
</tr>
`

table.innerHTML+=row

}

})

}

</script>

</body>
</html>
