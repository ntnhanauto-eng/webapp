<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar mưa Nowcast</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1e2d;
color:white;
text-align:center;
}

h2{
margin:10px;
}

#map{
width:100%;
height:85vh;
}

#time{
margin:10px;
font-size:14px;
opacity:0.8;
}
</style>
</head>

<body>

<h2>🌧 Radar mưa hiện tại → ~2h tới</h2>

<div id="map"></div>
<div id="time"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

<script>

const lat = 12.55
const lon = 109.2
const zoom = 7

const map = L.map('map',{
minZoom:3,
maxZoom:10,
preferCanvas:true
}).setView([lat,lon],zoom)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:10
}).addTo(map)

let radarLayers=[]
let framePosition=0

fetch("https://api.rainviewer.com/public/weather-maps.json")

.then(res=>res.json())

.then(data=>{

const host=data.host

// radar hiện tại
const radarPast=data.radar.past

// forecast
const radarFuture=data.radar.nowcast || []

const frames=[...radarPast.slice(-1),...radarFuture]

frames.forEach(frame=>{

const tileLayer=L.tileLayer(
`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`,
{
tileSize:256,
opacity:0,
maxZoom:10,
minZoom:3
})

radarLayers.push({
layer:tileLayer,
time:frame.time
})

})

radarLayers.forEach(f=>f.layer.addTo(map))

play()

})

function play(){

setInterval(()=>{

radarLayers.forEach(f=>f.layer.setOpacity(0))

const frame=radarLayers[framePosition]

frame.layer.setOpacity(0.7)

const date=new Date(frame.time*1000)

document.getElementById("time").innerHTML=
"Radar time: "+date.toLocaleTimeString()

framePosition++

if(framePosition>=radarLayers.length){
framePosition=0
}

},1000)

}



const map = L.map('map',{
preferCanvas:true,
minZoom:3,
maxZoom:10
}).setView([lat,lon],zoom)  
</script>

</body>
</html>
